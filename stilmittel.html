<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stilmittel-Check</title>
<style>
/* Layout: eine schmale Spalte fürs Handy – Kopf mit Fortschrittsleiste, darunter eine Fragekarte */
:root{
  --bg:#f4f5f3; --surface:#ffffff; --ink:#1c2321; --muted:#5d6763; --line:#d9dedb;
  --accent:#1d6a55; --accent-soft:#e3efe9; --on-accent:#ffffff;
  --ok:#1f7a3f; --ok-soft:#e2f2e6; --bad:#b3321f; --bad-soft:#f8e3df;
  --f-ui:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-verse:"Literata", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121514; --surface:#1b201e; --ink:#e8ecea; --muted:#a2aca8; --line:#323a37;
  --accent:#6fcfae; --accent-soft:#173129; --on-accent:#0f1312;
  --ok:#6fd08f; --ok-soft:#173222; --bad:#f08a78; --bad-soft:#3a1c17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121514; --surface:#1b201e; --ink:#e8ecea; --muted:#a2aca8; --line:#323a37;
  --accent:#6fcfae; --accent-soft:#173129; --on-accent:#0f1312;
  --ok:#6fd08f; --ok-soft:#173222; --bad:#f08a78; --bad-soft:#3a1c17; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:620px;margin:0 auto;display:grid;gap:18px}
header{display:grid;gap:10px}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font:700 1.7rem/1.15 var(--f-verse);margin:0;text-wrap:balance}
.intro{margin:0;color:var(--muted);font-size:15px}
.bar{display:flex;gap:3px}
.bar span{flex:1;height:7px;border-radius:2px;background:var(--line)}
.bar span.cur{background:var(--accent)}
.bar span.ok{background:var(--ok)} .bar span.bad{background:var(--bad)}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:16px}
.tag{justify-self:start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.prompt{font-size:1.15rem;font-weight:700;margin:0;text-wrap:pretty}
blockquote{margin:0;padding:12px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0}
blockquote p{margin:0;font:italic 400 1.12rem/1.55 var(--f-verse)}
blockquote cite{display:block;margin-top:6px;font:normal 13px var(--f-ui);color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);
  background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--bg);color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.fb{border-radius:8px;padding:12px 14px;font-size:16px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
.fb.ok b{color:var(--ok)} .fb.bad b{color:var(--bad)}
.btn{font:700 17px var(--f-ui);border:0;border-radius:8px;padding:13px 18px;cursor:pointer;background:var(--accent);color:var(--on-accent);width:100%}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.score{font:700 3.2rem/1 var(--f-verse);font-variant-numeric:tabular-nums;margin:0}
.score small{font-size:1.3rem;color:var(--muted)}
.miss{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.miss li{border-top:1px solid var(--line);padding-top:10px;font-size:15px}
.miss li .q{color:var(--muted)} .miss li .a{font-weight:700;color:var(--ok)}
.btns{display:grid;gap:10px}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.6}}}
</style>
</head>
<body style="margin:0">


<div class="wrap">
  <header>
    <div class="kicker">Quiz 1 · Sprachliche Stilmittel</div>
    <h1>Stilmittel-Check</h1>
    <p class="intro">20 Fragen: 10 Begriffe, 10 Verse aus bekannten Gedichten. Ca. 10 Minuten.</p>
    <div class="bar" id="bar"></div>
    <div class="meta"><span id="pos"></span><span id="pts"></span></div>
  </header>
  <main id="stage"></main>
</div>

<script>
const QUIZ = {"questions": [{"tag": "Begriff", "prompt": "Bildlicher Ausdruck ohne Vergleichswort – wie heißt das Stilmittel?", "options": ["Metapher", "Vergleich", "Symbol", "Personifikation"], "expl": "Die Metapher überträgt ein Bild direkt, ohne „wie“ oder „als“. Mit Vergleichswort wäre es ein Vergleich."}, {"tag": "Begriff", "prompt": "Woran erkennen Sie einen Vergleich sicher?", "options": ["An einem Vergleichswort wie „wie“, „als“ oder „als ob“", "An einem gleichen Anlaut mehrerer Wörter", "Daran, dass Dinge wie Menschen handeln", "An einer starken Übertreibung"], "expl": "Vergleich = Bild mit Vergleichswort (wie, als, als ob). Gleicher Anlaut = Alliteration, Dinge handeln = Personifikation, Übertreibung = Hyperbel."}, {"tag": "Begriff", "prompt": "Dinge oder Abstraktes handeln wie Menschen. Wie heißt das Stilmittel?", "options": ["Personifikation", "Metapher", "Euphemismus", "Symbol"], "expl": "Personifikation: Nicht-Menschliches bekommt menschliche Eigenschaften oder Handlungen. Sie belebt und macht nahbar."}, {"tag": "Begriff", "prompt": "Mehrere aufeinanderfolgende Verse oder Sätze beginnen gleich. Das ist eine …", "options": ["Anapher", "Alliteration", "Parallelismus", "Klimax"], "expl": "Anapher = gleicher Anfang. Achtung: Alliteration = gleicher Anlaut benachbarter Wörter; Parallelismus = gleicher Satzbau."}, {"tag": "Begriff", "prompt": "Welches Stilmittel ist eine spiegelbildliche Anordnung nach dem Muster A B – B A?", "options": ["Chiasmus", "Parallelismus", "Antithese", "Anapher"], "expl": "Chiasmus = Überkreuzstellung (A B – B A). Beim Parallelismus bleibt die Reihenfolge gleich (A B – A B)."}, {"tag": "Begriff", "prompt": "Gegensätzliche Begriffe oder Gedanken werden einander gegenübergestellt. Das ist eine …", "options": ["Antithese", "Klimax", "Hyperbel", "Akkumulation"], "expl": "Antithese = Gegenüberstellung von Gegensätzen. Typisch für den Barock: Leben – Tod, heute – morgen."}, {"tag": "Begriff", "prompt": "Zwei sich ausschließende Begriffe in einem Ausdruck, z. B. „bittersüß“. Das ist ein …", "options": ["Oxymoron", "Paradoxon", "Chiasmus", "Euphemismus"], "expl": "Oxymoron = Widerspruch in einem Ausdruck. Ein Paradoxon ist eine ganze Aussage, die nur scheinbar widersprüchlich ist („Ich weiß, dass ich nichts weiß.“)."}, {"tag": "Begriff", "prompt": "Eine schrittweise Steigerung heißt …", "options": ["Klimax", "Akkumulation", "Hyperbel", "Asyndeton"], "expl": "Klimax = Steigerung in Stufen. Akkumulation häuft nur an, ohne Steigerung. Hyperbel übertreibt in einem einzigen Ausdruck."}, {"tag": "Begriff", "prompt": "„Ich kam, sah, siegte.“ Eine Reihung ohne Bindewörter heißt …", "options": ["Asyndeton", "Akkumulation", "Parallelismus", "Anapher"], "expl": "Asyndeton = Reihung ohne „und“. Wirkung: beschleunigt, verdichtet."}, {"tag": "Begriff", "prompt": "Unangenehmes wird beschönigend ausgedrückt, z. B. „entschlafen“ für sterben. Das ist ein …", "options": ["Euphemismus", "Symbol", "Oxymoron", "Hyperbel"], "expl": "Euphemismus = Beschönigung. Wirkung: mildert, verhüllt."}, {"tag": "Vers", "prompt": "Welches Stilmittel liegt hier vor?", "verse": ["Nur manchmal schiebt der Vorhang der Pupille", "sich lautlos auf –."], "src": "Rilke, „Der Panther“, V. 9 f.", "options": ["Metapher", "Vergleich", "Euphemismus", "Anapher"], "expl": "„Vorhang der Pupille“ ist ein Bild ohne Vergleichswort: Das Augenlid wird zum Vorhang. Also eine Metapher."}, {"tag": "Vers", "prompt": "Welches Stilmittel liegt hier vor?", "verse": ["Frühling läßt sein blaues Band", "Wieder flattern durch die Lüfte"], "src": "Mörike, „Er ist’s“, V. 1 f.", "options": ["Personifikation", "Vergleich", "Hyperbel", "Antithese"], "expl": "Der Frühling „läßt“ etwas flattern, er handelt wie ein Mensch. Das ist eine Personifikation."}, {"tag": "Vers", "prompt": "Welches Stilmittel steckt in „Gang geschmeidig“?", "verse": ["Der weiche Gang geschmeidig starker Schritte"], "src": "Rilke, „Der Panther“, V. 5", "options": ["Alliteration", "Anapher", "Asyndeton", "Oxymoron"], "expl": "„Gang geschmeidig“: Beide Wörter beginnen mit G. Gleicher Anlaut benachbarter Wörter ist eine Alliteration."}, {"tag": "Vers", "prompt": "Welches Stilmittel prägt diesen Vers?", "verse": ["Was dieser heute baut, reißt jener morgen ein"], "src": "Gryphius, „Es ist alles eitel“, V. 2", "options": ["Antithese", "Anapher", "Euphemismus", "Personifikation"], "expl": "Bauen – einreißen, heute – morgen, dieser – jener: Gegensätze werden gegenübergestellt. Das ist eine Antithese."}, {"tag": "Vers", "prompt": "Welches Stilmittel verbindet die beiden Verse?", "verse": ["Was itzund prächtig blüht, soll bald zertreten werden;", "Was itzt so pocht und trotzt, ist morgen Asch und Bein;"], "src": "Gryphius, „Es ist alles eitel“, V. 5 f.", "options": ["Anapher", "Alliteration", "Chiasmus", "Klimax"], "expl": "Beide Verse beginnen mit „Was itz…“. Gleicher Versanfang ist eine Anapher. Sie gliedert und steigert."}, {"tag": "Vers", "prompt": "Welches Stilmittel liegt in der Reihe „Nichtigkeit … Schatten, Staub und Wind“ vor?", "verse": ["Als schlechte Nichtigkeit, als Schatten, Staub und Wind"], "src": "Gryphius, „Es ist alles eitel“, V. 12", "options": ["Klimax", "Antithese", "Chiasmus", "Parallelismus"], "expl": "Das Irdische wird Schritt für Schritt immer substanzloser: Schatten, dann Staub, dann Wind. Das ist eine Klimax."}, {"tag": "Vers", "prompt": "Welches Stilmittel liegt vor?", "verse": ["Die Kunst ist lang, und kurz ist unser Leben."], "src": "nach Goethe, „Faust I“", "options": ["Chiasmus", "Parallelismus", "Anapher", "Klimax"], "expl": "Kunst (A) – lang (B) / kurz (B) – Leben (A): Die Glieder sind über Kreuz gestellt. Das ist ein Chiasmus. Er betont hier zugleich den Gegensatz."}, {"tag": "Vers", "prompt": "„Der Port naht mehr und mehr sich zu der Glieder Kahn.“ Welches Stilmittel ist „der Glieder Kahn“?", "verse": ["Der Port naht mehr und mehr sich zu der Glieder Kahn."], "src": "Gryphius, „Abend“, V. 5 (M1)", "options": ["Metapher", "Vergleich", "Alliteration", "Euphemismus"], "expl": "Der Körper wird ohne Vergleichswort zum Boot („Kahn“), das Leben zur Fahrt auf den Hafen (Tod) zu. Das ist eine Metapher."}, {"tag": "Vers", "prompt": "Welches Stilmittel liegt vor?", "verse": ["Dies Leben kömmt mir vor als eine Rennebahn."], "src": "Gryphius, „Abend“, V. 8 (M1)", "options": ["Vergleich", "Metapher", "Personifikation", "Klimax"], "expl": "Achtung Falle: Das Vergleichswort „als“ steht da. Das Leben wird mit einer Rennbahn verglichen, also ist es ein Vergleich und keine Metapher."}, {"tag": "Vers", "prompt": "Welches Stilmittel steckt in „der müde Leib entschläft“?", "verse": ["Laß, wenn der müde Leib entschläft, die Seele wachen,"], "src": "Gryphius, „Abend“, V. 12 (M1)", "options": ["Euphemismus", "Hyperbel", "Chiasmus", "Alliteration"], "expl": "„Entschlafen“ steht beschönigend für sterben. Das ist ein Euphemismus."}]};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let order, idx, results;   // results[i] = true/false/undefined (index in QUIZ.questions)
function start(list){
  order = list; idx = 0; results = {};
  render();
}
function tagOf(q){ if(q.tag) return q.tag; if(!q.verse) return 'Begriff'; return q.verse[0].includes(' ') ? 'Vers' : 'Wort'; }

function drawBar(){
  $('#bar').innerHTML = order.map((qi,i)=>{
    const r = results[qi]; const c = r===true?'ok':r===false?'bad':(i===idx?'cur':'');
    return `<span class="${c}"></span>`}).join('');
  const right = order.filter(qi=>results[qi]===true).length;
  $('#pos').textContent = idx < order.length ? `Frage ${idx+1} von ${order.length}` : 'Fertig';
  $('#pts').textContent = `${right} richtig`;
}

function render(){
  drawBar();
  if(idx >= order.length) return finish();
  const qi = order[idx], q = QUIZ.questions[qi];
  const opts = shuffle(q.options.map((t,i)=>({t, ok:i===0})));
  const verse = q.verse ? `<blockquote>${q.verse.map(v=>`<p>${esc(v)}</p>`).join('')}${q.src?`<cite>${esc(q.src)}</cite>`:''}</blockquote>` : '';
  $('#stage').innerHTML = `<section class="card" aria-live="polite">
    <span class="tag">${esc(tagOf(q))}</span>
    <p class="prompt">${esc(q.prompt)}</p>${verse}
    <div class="opts">${opts.map((o,i)=>`<button class="opt" id="opt${i}" data-ok="${o.ok}"><span class="k">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
    <div id="after"></div></section>`;
  document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answer(b,q,qi)));
}

function answer(btn,q,qi){
  const ok = btn.dataset.ok === 'true';
  results[qi] = ok;
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled = true;
    if(b.dataset.ok==='true') b.classList.add('right');
    else if(b===btn) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const last = idx === order.length-1;
  $('#after').innerHTML = `<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Richtig.':'Leider falsch. Richtig ist: '+esc(q.options[0])}</b>${esc(q.expl)}</div>
    <button class="btn" id="next" style="margin-top:14px">${last?'Ergebnis anzeigen':'Weiter'}</button>`;
  drawBar();
  const n = $('#next'); n.addEventListener('click',()=>{idx++;render();window.scrollTo({top:0})}); n.focus({preventScroll:true});
}

function finish(){
  const right = order.filter(qi=>results[qi]===true).length;
  const wrong = order.filter(qi=>results[qi]!==true);
  const pct = right/order.length;
  const msg = pct===1 ? 'Alles richtig. Sie sind gut vorbereitet.' : pct>=.75 ? 'Sicher. Schauen Sie sich die Fehler unten noch einmal an.' : pct>=.5 ? 'Solide Grundlage. Wiederholen Sie die falschen Fragen und lesen Sie die passende Hilfe (H1/H2) nach.' : 'Hier lohnt sich Üben: Lesen Sie H1/H2 und wiederholen Sie die falschen Fragen.';
  $('#stage').innerHTML = `<section class="card">
    <span class="tag">Ergebnis</span>
    <p class="score">${right}<small> / ${order.length}</small></p>
    <p style="margin:0">${msg}</p>
    ${wrong.length?`<ul class="miss">${wrong.map(qi=>{const q=QUIZ.questions[qi];return `<li><div class="q">${esc(q.prompt)}${q.verse?' – „'+esc(q.verse.join(' / '))+'“':''}</div><div class="a">${esc(q.options[0])}</div></li>`}).join('')}</ul>`:''}
    <div class="btns">${wrong.length?`<button class="btn" id="redo">Nur die ${wrong.length} falschen wiederholen</button>`:''}
    <button class="btn ghost" id="again">Ganzes Quiz neu starten</button></div></section>`;
  if(wrong.length) $('#redo').addEventListener('click',()=>start(wrong));
  $('#again').addEventListener('click',()=>start(QUIZ.questions.map((_,i)=>i)));
}
start(QUIZ.questions.map((_,i)=>i));
</script>

</body>
</html>
